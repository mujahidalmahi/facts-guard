services:
  backend:
    build:
      context: ./factguard-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./factguard-backend/.env
    environment:
      - FRONTEND_URL=http://localhost:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./factguard-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./factguard-frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
