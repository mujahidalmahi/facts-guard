<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactGuard Splash Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ── Splash overlay ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -4rem;
    }

    #splash.exit {
      opacity: 0;
      transform: translateY(-100%);
    }

    /* ── Text layers (two-layer like KOTHIK) ── */
    .text-stack {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 1.3em;
      margin-bottom: 0.5rem;
    }

    .text-outline {
      position: absolute;
      font-size: clamp(5rem, 16vw, 10rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      -webkit-text-stroke: 2px rgba(241, 245, 249, 0.25);
      -webkit-text-fill-color: transparent;
      color: transparent;
      transform: translateY(-0.15em);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      min-height: 1.2em;
    }

    #splash h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f1f5f9;
      min-height: 1.2em;
    }

    #splash .tagline {
      position: absolute;
      bottom: 3rem;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      color: #94a3b8;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #splash .tagline.show {
      opacity: 1;
    }

    /* ── Loading bar ── */
    .bar-track {
      width: 280px;
      max-width: 70vw;
      height: 4px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: #6366f1;
      transition: width 0.1s linear;
    }

    /* ── Color pulse ── */
    @keyframes pulseBg {
      0%   { background: #a28089; }
      25%  { background: #a0d2eb; }
      50%  { background: #312e81; }
      75%  { background: #1e293b; }
      100% { background: #0f172a; }
    }

    #splash {
      animation: pulseBg 2.8s ease forwards;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-center">
      <div class="text-stack">
        <div class="text-outline">FactGuard</div>
        <h1 id="scramble"></h1>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="bar"></div>
      </div>
    </div>
    <p class="tagline" id="tagline">AI-powered trust verification</p>
  </div>

  <script>
    (function() {
      const WORD = 'FactGuard';
      const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*';
      const DURATION = 2000; // ms
      const INTERVAL = 60;   // ms per frame

      const el = document.getElementById('scramble');
      const bar = document.getElementById('bar');
      const tagline = document.getElementById('tagline');

      let start = performance.now();
      let frame;
      const totalSteps = Math.ceil(DURATION / INTERVAL);
      let step = 0;

      function scramble() {
        const elapsed = performance.now() - start;
        const progress = Math.min(elapsed / DURATION, 1);
        const charsRevealed = Math.floor(progress * WORD.length);

        let out = '';
        for (let i = 0; i < WORD.length; i++) {
          if (i < charsRevealed) {
            out += WORD[i];
          } else {
            out += CHARS[Math.floor(Math.random() * CHARS.length)];
          }
        }
        el.textContent = out;

        // bar
        bar.style.width = (progress * 100) + '%';

        // tagline appears when scramble is mostly done
        if (progress > 0.6) {
          tagline.classList.add('show');
        }

        if (progress < 1) {
          frame = requestAnimationFrame(scramble);
        } else {
          el.textContent = WORD;
          bar.style.width = '100%';

          // wait 1s after fully revealed, then slide up
          setTimeout(() => {
            document.getElementById('splash').classList.add('exit');
            setTimeout(() => {
              document.getElementById('splash').style.display = 'none';
              document.body.style.overflow = 'auto';
              document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#f1f5f9;font-size:2rem;font-weight:600;font-family:system-ui,sans-serif;">
                  Landing page content goes here
                </div>
              `;
            }, 800);
          }, 1000);
        }
      }

      frame = requestAnimationFrame(scramble);
    })();
  </script>
</body>
</html>
