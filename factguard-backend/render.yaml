services:
  - type: web
    name: factguard-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://factguard.vercel.app
      - key: AIML_API_MODEL
        value: gpt-4o-mini
      - key: AIML_API_ENABLED
        value: "true"
